# ==========================================================================
# SubBoost 规则体系 · mihomo 覆写版
# 复刻自 github.com/SubBoost/subboost (AGPL-3.0)，规则源 MetaCubeX/meta-rules-dat
#
# 由 test/_sb/gen_override.py 生成，请勿手改 —— 下次生成会覆盖。
# 改配置改生成器后重跑；校验跑 test/_sb/verify.py（19 项静态检查）。
#
# 相对原项目的落地适配（详见生成器内注释）：
#   · 规则集走 jsdelivr 镜像（原版 github raw 国内超时）
#   · 每个规则集加 proxy: 节点选择 —— 缺了会静默全量拉取失败
#   · 节点成员用 include-all + exclude-filter 表达（原版直写节点名）
#   · 补 6 个地区 url-test 组（原版 v2.5.0 起移除）
#   · 业务组只放聚合组，单节点选择交给新增的「手动切换」
#   · 地区缩写用非字母边界而非单词边界 —— 兼容 US01/HK_02 这类命名
#   · 「其他国家」用 select + DIRECT —— url-test 空组会让内核求值崩溃
#
# 注意：
#   · 勿与「GPT写的」同时启用，两者 proxy-groups 与 rules 均整段替换
#   · DNS 不在本覆写，由「全局DNS统一覆写（合并版）」负责
#   · 地理库由内置mihomo.yaml 提供，此处不写
#   · 改名会重置已保存的组选择，首次启用需重挑默认节点
# ==========================================================================


sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, "8080-8880"]
      override-destination: true
    QUIC:
      ports: [443, 8443]

proxy-groups:

  # 手动选择代理节点
  - name: "节点选择"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies: [自动选择, 美国节点, 香港节点, 日本节点, 狮城节点, 台湾节点, 韩国节点, 其他国家, 手动切换, DIRECT, REJECT]

  # 自动选择最快节点
  - name: "自动选择"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    type: url-test
    include-all: true
    exclude-filter: ^(剩余流量|剩余订阅流量|距离下次重置剩余|套餐到期|订阅到期|到期时间|过期时间)\s*[:：]|^(余额|会员)\s*\||版本太旧|请更新|更新软件|去官网更新
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false

  # 手动指定单个节点 —— 业务组只放聚合组后，单节点选择能力由本组承载
  - name: "手动切换"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png
    type: select
    include-all: true
    exclude-filter: ^(剩余流量|剩余订阅流量|距离下次重置剩余|套餐到期|订阅到期|到期时间|过期时间)\s*[:：]|^(余额|会员)\s*\||版本太旧|请更新|更新软件|去官网更新

