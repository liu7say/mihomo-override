# rules+（末尾 + 号）是 mihomo-party 覆写合并的「数组追加」语义：
# 本段追加在已有规则之后，而不是整段替换。
# 依赖「全局DNS统一覆写」JS 先把 config.rules 重置为 29 条工作内网规则，
# 本段再接在它后面 —— 两边都写 rules 会互相整段覆盖。
