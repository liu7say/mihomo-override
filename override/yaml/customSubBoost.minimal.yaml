# ==========================================================================
# SubBoost 规则体系 · mihomo 覆写版 (YAML rules: 双轨覆写)
# 由 scripts/gen_override.py 自动生成，请勿手动编辑。
# 核心工程适配说明：
#   · 规则集走 jsdelivr 镜像，全量带 proxy: 节点选择 杜绝静默失败
#   · 节点采用 include-all + exclude-filter 动态过滤
#   · 补全 6 核心地区 url-test (lazy: true, tolerance: 50) 与 1 其他国家 select
#   · 地区代码采用 NB 非字母边界正则，彻底解决 US01/HK_02 漏判
#   · rules: 严格整段替换订阅自带旧规则，彻底避免 MATCH 截断死锁
# ==========================================================================

ipv6: false

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, "8080-8880"]
      override-destination: true
    QUIC:
      ports: [443, 8443]

proxy-groups:

  - name: "节点选择"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies: [自动选择, 美国节点, 香港节点, 日本节点, 狮城节点, 台湾节点, 韩国节点, 其他国家, 手动切换, DIRECT, REJECT]

  - name: "自动选择"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    type: url-test
    include-all: true
    exclude-filter: "(?:剩余流量|剩余订阅流量|距离下次重置剩余|(?:套餐|订阅)?到期(?:时间)?|过期(?:时间)?|套餐|Expire)\\s*[:：]|^(?:流量|Traffic)\\s*[:：]|(?:官网|发布页|网址|群组|频道)\\s*[:：]|^(?:余额|会员)\\s*\\||版本太旧|请更新|更新软件|去官网更新|非代理节点|请勿连接|如遇节点失效|永久发布页|欢迎加入"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true

  - name: "手动切换"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available_1.png
    type: select
    include-all: true
    exclude-filter: "(?:剩余流量|剩余订阅流量|距离下次重置剩余|(?:套餐|订阅)?到期(?:时间)?|过期(?:时间)?|套餐|Expire)\\s*[:：]|^(?:流量|Traffic)\\s*[:：]|(?:官网|发布页|网址|群组|频道)\\s*[:：]|^(?:余额|会员)\\s*\\||版本太旧|请更新|更新软件|去官网更新|非代理节点|请勿连接|如遇节点失效|永久发布页|欢迎加入"

  - name: "广告拦截"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png
    type: select
    proxies: [REJECT, DIRECT, 节点选择, 手动切换]

  - name: "AI 服务"
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png
    type: select
    proxies: [节点选择, 自动选择, 美国节点, 香港节点, 日本节点, 狮城节点, 台湾节点, 韩国节点, 其他国家, 手动切换, DIRECT, REJECT]

  - name: "私有网络"
