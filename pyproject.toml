[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomo-override"
version = "1.0.0"
description = "适用于 FlClash / Clash Party 等 mihomo 内核的高性能规则覆写生成器与验证套件"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "liu7say" }
]
dependencies = [
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]
