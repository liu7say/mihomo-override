# ==============================================================================
# GitHub Actions: 自动化 Release 发布工作流 (release.yml)
# 触发机制: 推送以 'v' 开头的版本标签 (例如: git push origin v1.0)
# 功能定位: 自动编译脱敏覆写、执行质量门禁测试、打包产物并生成带附件的 GitHub Release
# ==============================================================================

name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建覆写产物并发布 Release
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库完整源码
      - name: 检出源码
        uses: actions/checkout@v4

      # 2. 设置 Python 运行环境
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. 设置 Node.js 运行环境 (供 AST 自检与 Node 运行时断言套件执行)
      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. 安装 Python 核心构建依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. 执行核心生成器，并行渲染 3 大预设档位
      - name: 编译覆写产物
        run: |
          python scripts/gen_override.py

      # 6. 执行全套质量门禁断言测试
      - name: 运行 Node.js 运行时测试套件
        run: |
          python scripts/test_js_override.py

      - name: 运行代理组拓扑无环检测
        run: |
          python scripts/nest_check.py

      # 7. 准备 Release 附件打包 (将脱敏 example 模板与双轨 yaml 打包为 zip)
      - name: 打包 Release 资产压缩包
        run: |
          mkdir -p dist
          # 创建归档压缩包包含 example 与 yaml 目录
          zip -r "dist/mihomo-override-${{ github.ref_name }}.zip" override/example override/yaml README.md LICENSE
          # 复制独立的 6 个覆写文件到 dist 目录供单独下载
          cp override/example/*.js dist/
          cp override/yaml/*.yaml dist/
          echo "=== 待发布附件清单 ==="
          ls -la dist/

      # 8. 发布 GitHub Release 并挂载资产附件
      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          name: "Mihomo Override ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## Mihomo Override 规则覆写体系 ${{ github.ref_name }} 正式发布

            适用于 **Flclash**、**Clash Party**、**bettbox** 及 **Sparkle** 等基于 Mihomo (Clash.Meta) 内核客户端的高性能全合一规则覆写与双轨配置体系。

            > **说明**：本项目为独立维护的 Mihomo 覆写体系（参考并借鉴 SubBoost / ACL4SSR 分流架构），非 SubBoost 官方版本。采用 GPL-3.0 协议开源。

            ---

            ### 本次发布资产 (Assets 清单)

            #### 1. 独立 All-in-One JS 覆写模板 (推荐：复制即用，已脱敏)
            - **`mihomoOverride.minimal.example.js`**：【极简版】16 策略组, 12 规则集, 适合轻量办公与省电
            - **`mihomoOverride.standard.example.js`**：【标准版】23 策略组, 24 规则集, 日常黄金主流推荐
            - **`mihomoOverride.full.example.js`**：【全量版】41 策略组, 94 规则集, 极客细粒度分流

            #### 2. 独立纯 YAML 覆写备份 (供仅支持 YAML 的客户端使用)
            - **`mihomoOverride.minimal.yaml`**：【极简版】双轨纯 YAML 覆写
            - **`mihomoOverride.standard.yaml`**：【标准版】双轨纯 YAML 覆写
            - **`mihomoOverride.full.yaml`**：【全量版】双轨纯 YAML 覆写

            #### 3. 完整整合包
            - **`mihomo-override-${{ github.ref_name }}.zip`**：包含上述全部模板与使用说明。

            ---

            ### 核心架构调优特性
            - **零冷启动死锁**：规则集默认 `DIRECT` + `fastly.jsdelivr.net` 高可用 CDN 直连，彻底规避 `EOF` 异常；
            - **根除测速风暴**：引入 `lazy: true` 与 `tolerance: 50`，消除频繁后台测速对路由器连接表的侵蚀；
            - **节点清洗引擎**：客户端运行时自动过滤公告/流量垃圾节点，清洗高倍率吸血节点；
            - **零隐私泄露**：私有内网配置物理隔离，开源产物 100% 脱敏纯净。
